<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Practice - LocalBiz Connect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="b1">

<header class="topbar">
    <div class="logo">LocalBiz Connect</div>
    

    <nav>   
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="about.html">About</a>
        <a href="service.html">Services</a>
        <a href="contact.html">Contact</a>
                <a href="student.html">Student Profile</a>
    </nav>
</header>

<section class="page-title">
    <h1>Contact Us</h1>
    <p>Send a service enquiry. Later this form will connect to backend and database</p>
</section>

<section class="form-box">

    <form onsubmit="submitEnquiry(event)">

        <label for="studentName">Name</label>
        <input id="studentName" type="text" placeholder="Enter the name">

        <label for="studentEmail">Email </label>
        <input id="studentEmail" type="email" placeholder="Enter your email">

        <label for="service">Service</label>
        <select id="service">
        <option value="">Select one option</option>
            <option>Website Design</option>
            <option>Digital Marketing </option>
            <option>App Development</option>
            <option>It Support</option>
        </select>



        <label for="message">Message</label>
    <textarea id="message" placeholder="Enter your message"></textarea>

        <button type="submit" class="primary-btn">Submit Practice Form</button>
       <p id="formmessage"></p>

    </form>

</section>

<footer>
    <p>Form Practice Page - LocalBiz Connect</p>
</footer>
<script src="script.js"></script>   
</body>
</html>
